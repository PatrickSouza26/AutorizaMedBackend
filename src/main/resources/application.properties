spring.application.name=api

# ==========================================
# CONFIGURAÇÕES DO JWT
# ==========================================
api.security.token.secret=autorizamed-senha-super-secreta-2026

# ==========================================
# CONFIGURAÇÕES DO BANCO DE DADOS (POSTGRESQL)
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# ==========================================
# CONFIGURAÇÕES DO HIBERNATE / JPA
# ==========================================
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==============================================================
# CONFIGURAÇÕES DE INTELIGÊNCIA ARTIFICIAL (GEMINI - LANGCHAIN4J)
# ==============================================================
langchain4j.google-ai-gemini.chat-model.api-key=${LANGCHAIN4J_GOOGLE_AI_GEMINI_CHAT_MODEL_API_KEY}

langchain4j.google-ai-gemini.chat-model.model-name=gemini-2.5-flash

langchain4j.google-ai-gemini.chat-model.temperature=0.0

langchain4j.google-ai-gemini.chat-model.log-requests-and-responses=true


# ==============================================================
# RESILIENCE4J - BLINDAGEM DA IA (CIRCUIT BREAKER & RETRY)
# ==============================================================
# 1. Configuração do Retry (Tentativas)
resilience4j.retry.instances.ia-auditoria.max-attempts=3
resilience4j.retry.instances.ia-auditoria.wait-duration=2s
resilience4j.retry.instances.ia-auditoria.enable-exponential-backoff=true
resilience4j.retry.instances.ia-auditoria.exponential-backoff-multiplier=2

# 2. Configuração do Disjuntor (Circuit Breaker)
resilience4j.circuitbreaker.instances.ia-auditoria.sliding-window-size=5
resilience4j.circuitbreaker.instances.ia-auditoria.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.ia-auditoria.wait-duration-in-open-state=30s